<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1e1b4b;--sub:#6b7280;--line:#e5e7eb;--ac:#6d28d9;--ac2:#7c3aed;--ok:#059669;--bad:#dc2626;--warn:#b45309;--chip:#ede9fe}
@media (prefers-color-scheme:dark){:root{--bg:#0f0a1e;--card:#1a1330;--ink:#ede9fe;--sub:#a5a1c2;--line:#2e2750;--ac:#a78bfa;--ac2:#8b5cf6;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--chip:#2a2050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:13px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:88px;resize:vertical}
input[type=checkbox]{width:22px;min-height:22px;height:22px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink);margin:0}
button{min-height:44px;padding:0 16px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--ac2);color:#fff}
button.ghost{background:var(--chip);color:var(--ac)}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap;background:var(--card);color:var(--sub);border:1px solid var(--line)}
.tabs button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
.msg.ok{background:rgba(5,150,105,.12);color:var(--ok)}.msg.bad{background:rgba(220,38,38,.12);color:var(--bad)}.msg.warn{background:rgba(180,83,9,.12);color:var(--warn)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto;font-size:12px;margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center}
.bar>div{max-width:720px;width:100%;display:flex;gap:10px}.bar button{flex:1}
.hide{display:none}
.phone{max-width:300px;margin:8px auto 14px;border:6px solid #111;border-radius:30px;background:#0a0015;color:#fff;padding:16px 12px;min-height:150px;font-size:14px}
.gate{background:#17102b;border:1px solid #3b2a6b;border-radius:20px;padding:18px;text-align:center}
.gt{font-size:18px;font-weight:900;margin-top:6px}.gm{font-size:13px;line-height:1.6;color:#cdbff5;margin:8px 0 4px}
.gb{margin-top:8px;padding:11px;border-radius:12px;border:1px solid #4c3a85;color:#c4b5fd;font-weight:800}.gb.p{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tip{margin-top:10px;border-radius:12px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);padding:8px 10px;font-size:12.5px;font-weight:600;color:#c7d2fe}
.chip2{font-size:11px;font-weight:800;border-radius:12px;padding:5px 8px;background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.4);color:#c7d2fe;max-width:55%;text-align:center}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:6px 12px}
.sch{margin-top:14px;padding-top:6px;border-top:1px dashed var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var OWNER='rsakashh',REPO='mov-remote-message',BRANCH='main';
var LS='ds_admin_v1';
var RULE_KEYS=[
 ['allowance','অন্যান্য খরচ / Others spend (এখন ২৪৫০)',0,100000],
 ['basicDiv','রুম রেন্ট = মিড ÷ কত (এখন ৩)',0.5,20],
 ['basicMul','বেসিক = রুম রেন্ট × কত (এখন ২)',0.1,20],
 ['otDiv','OT রেট = বেসিক ÷ কত (এখন ১০৪)',26,400],
 ['dayDiv','অনুপস্থিতি রেট = বেসিক ÷ কত (এখন ৩০)',20,31],
 ['exact','হিসাবের পদ্ধতি',0,1]
];
var S={token:null,tab:'calc',msg:null,busy:false,cfg:{calc:[],ads:{ids:{}},defaults:{},flags:{},min:{},maint:{},texts:{},occ:[],rate:''},cfgSha:null,notice:null,noticeSha:null,loaded:false,pg:'16000',hist:{file:'config.json',list:null,loading:false,view:null}};
var app=document.getElementById('app');
var enc=new TextEncoder(),dec=new TextDecoder();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function utf8ToB64(str){return b64(enc.encode(str));}
function b64ToUtf8(s){return dec.decode(unb64(String(s).replace(/\s/g,'')));}

/* ---------- token lock (password -> AES) ---------- */
async function keyFrom(pw,salt){
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function lockToken(token,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  var k=await keyFrom(pw,salt);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(token));
  localStorage.setItem(LS,JSON.stringify({s:b64(salt),i:b64(iv),d:b64(ct)}));
}
async function unlockToken(pw){
  var o=JSON.parse(localStorage.getItem(LS));
  var k=await keyFrom(pw,unb64(o.s));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},k,unb64(o.d));
  return dec.decode(pt);
}
function hasSaved(){try{return !!localStorage.getItem(LS);}catch(e){return false;}}

/* ---------- GitHub API ---------- */
async function gh(path,opt){
  opt=opt||{};
  var res=await fetch('https://api.github.com'+path,{method:opt.method||'GET',cache:'no-store',headers:{'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  var data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){var m=(data&&data.message)||('HTTP '+res.status);var err=new Error(m);err.status=res.status;throw err;}
  return data;
}
function errText(e){
  if(e.status===401)return 'টোকেন ভুল বা মেয়াদ শেষ। নতুন টোকেন দিয়ে আবার সেট করুন।';
  if(e.status===403)return 'অনুমতি নেই বা সীমা শেষ ('+e.message+')';
  if(e.status===404)return 'ফাইল/রিপো পাওয়া যায়নি বা টোকেনের অনুমতি নেই';
  if(e.status===409||e.status===422)return 'ফাইল অন্য কোথাও বদলেছে। "আবার লোড" চেপে নতুন করে চেষ্টা করুন। ('+e.message+')';
  return e.message||'ত্রুটি';
}
async function getFile(name){
  try{
    var d=await gh('/repos/'+OWNER+'/'+REPO+'/contents/'+name+'?ref='+BRANCH);
    return {sha:d.sha,json:JSON.parse(b64ToUtf8(d.content))};
  }catch(e){if(e.status===404)return {sha:null,json:null};throw e;}
}
async function putFile(name,obj,sha,message){
  var body={message:message,content:utf8ToB64(JSON.stringify(obj,null,2)+'\n'),branch:BRANCH};
  if(sha)body.sha=sha;
  var d=await gh('/repos/'+OWNER+'/'+REPO+'/contents/'+name,{method:'PUT',body:body});
  return d.content.sha;
}

/* ---------- app repo sync (remote-defaults.json) ---------- */
var APP={owner:'rsakashh',repo:'my-overtime-v2',branch:'ui-redesign',file:'remote-defaults.json'};
function bakedFrom(obj){
  var o={_note:'Written by the admin panel. Do not edit by hand.'};
  ['calc','ads','defaults','occ'].forEach(function(k){if(obj[k]!==undefined)o[k]=obj[k];});
  if(obj.texts){var t={};['mail','wa','terms','privacy','share'].forEach(function(k){if(obj.texts[k])t[k]=obj.texts[k];});if(Object.keys(t).length)o.texts=t;}
  if(obj.rate!==undefined)o.rate=obj.rate;
  return o;
}
async function syncApp(obj){
  var path='/repos/'+APP.owner+'/'+APP.repo+'/contents/'+APP.file;
  var cur=null;
  try{cur=await gh(path+'?ref='+APP.branch);}catch(e){if(e.status!==404)throw e;}
  var text=JSON.stringify(bakedFrom(obj),null,2)+'\n';
  if(cur&&cur.content&&b64ToUtf8(cur.content)===text)return 'same';
  var body={message:'remote-defaults: update from admin panel',content:utf8ToB64(text),branch:APP.branch};
  if(cur&&cur.sha)body.sha=cur.sha;
  await gh(path,{method:'PUT',body:body});
  return 'saved';
}
function appErr(e){
  if(e.status===401||e.status===403||e.status===404)return 'টোকেনে অ্যাপ রিপো ('+APP.repo+') এর Contents: Read and write অনুমতি দিন, আর ব্রাঞ্চ '+APP.branch+' আছে কিনা দেখুন ('+e.message+')';
  return errText(e);
}
async function trySync(obj){
  try{var r=await syncApp(obj);return {k:'ok',t:r==='same'?' অ্যাপ রিপোতে আগেই এই অবস্থায় আছে।':' অ্যাপ রিপোতেও (remote-defaults.json) সেভ হয়েছে, নতুন বিল্ডে ঢুকবে।'};}
  catch(e){return {k:'warn',t:' ⚠️ কিন্তু অ্যাপ রিপোতে সেভ হয়নি: '+appErr(e)};}
}
function appSyncCard(){
  return '<div class="card"><h2>📦 অ্যাপ রিপো সিঙ্ক</h2><div class="sub">প্রতিবার কনফিগ প্রকাশ করলে এটা নিজে নিজেই হয়। প্রথমবার বা হাতে করতে চাইলে সর্বশেষ প্রকাশিত config.json থেকে '+APP.file+' বানিয়ে '+APP.repo+' ('+APP.branch+') রিপোতে রাখুন। নতুন বিল্ডের আগে ফোনে <b>git pull</b> করে নেবেন।</div><div style="margin-top:10px"><button id="appSync" style="width:100%">এখনই সিঙ্ক করুন</button></div></div>';
}

/* ---------- model <-> form ---------- */
var DEF={allowance:2450,basicDiv:3,basicMul:2,dayDiv:30,otNum:2,otDiv:104,exact:0};
var FLAG_KEYS=[['pdf','PDF ও WhatsApp শেয়ার'],['cloud','ক্লাউড সিঙ্ক'],['backup','ব্যাকআপ ও রিস্টোর'],['raise','বেতন বৃদ্ধি ক্যালকুলেটর'],['reminders','রিমাইন্ডার ও নোটিফিকেশন']];
var NT_COL={info:'#3b82f6',success:'#10b981',warning:'#f59e0b',error:'#ef4444'};
function ob(x){return x&&typeof x==='object'&&!Array.isArray(x)?JSON.parse(JSON.stringify(x)):{};}
function newDate(){return 'n'+Date.now().toString(36);}
function defNotice(){return {active:true,push:false,type:'info',date:newDate(),title:'',message:'',button:'',below:'',startAt:'',endAt:'',rollout:''};}
function loadCfg(c){
  c=c&&typeof c==='object'?c:{};
  S.cfg={calc:(Array.isArray(c.calc)?c.calc:[]).map(function(r){var o={from:String(r.from||'')};RULE_KEYS.forEach(function(k){o[k[0]]=(r[k[0]]===undefined||r[k[0]]===null)?'':String(r[k[0]]);});return o;}),
    ads:ob(c.ads),defaults:ob(c.defaults),flags:ob(c.flags),min:ob(c.min),maint:ob(c.maint),texts:ob(c.texts),
    occ:(Array.isArray(c.occ)?c.occ:[]).map(function(e){return {date:String((e&&e.date)||''),title:String((e&&e.title)||'')};}),
    rate:(c.rate===undefined||c.rate===null)?'':String(c.rate)};
  if(!S.cfg.ads.ids||typeof S.cfg.ads.ids!=='object')S.cfg.ads.ids={};
}
function loadNotice(n){
  n=n&&typeof n==='object'?n:null;
  S.notice=n?{active:!!n.active,push:n.push===true,type:n.type||'info',date:n.date||newDate(),title:n.title||'',message:n.message||'',button:n.button||'',below:n.below||'',startAt:n.startAt||'',endAt:n.endAt||'',rollout:(n.rollout===undefined||n.rollout===null)?'':String(n.rollout)}:defNotice();
}
function gp(path){var o=S.cfg,ps=path.split('.');for(var i=0;i<ps.length;i++){if(o==null)return undefined;o=o[ps[i]];}return o;}
function sp(path,v){var ps=path.split('.'),o=S.cfg;for(var i=0;i<ps.length-1;i++){if(!o[ps[i]]||typeof o[ps[i]]!=='object')o[ps[i]]={};o=o[ps[i]];}o[ps[ps.length-1]]=v;}
function dp(path){var ps=path.split('.'),o=S.cfg;for(var i=0;i<ps.length-1;i++){if(!o[ps[i]])return;o=o[ps[i]];}delete o[ps[ps.length-1]];}
function sched(src,out,errs,tag){
  var s=String(src.startAt||''),e=String(src.endAt||''),r=String(src.rollout==null?'':src.rollout).trim();
  if(s){if(isNaN(Date.parse(s)))errs.push(tag+'শুরুর সময় ভুল');else out.startAt=s;}
  if(e){if(isNaN(Date.parse(e)))errs.push(tag+'শেষের সময় ভুল');else out.endAt=e;}
  if(out.startAt&&out.endAt&&Date.parse(out.endAt)<=Date.parse(out.startAt))errs.push(tag+'শেষের সময় শুরুর পরে হতে হবে');
  if(r!==''){var n=Number(r);if(!isFinite(n)||n<0||n>100||Math.round(n)!==n)errs.push(tag+'ধাপে ধাপে চালু: ০–১০০ এর পূর্ণসংখ্যা');else if(n<100)out.rollout=n;}
}
function buildConfig(){
  var errs=[],out={};
  var seen={},calc=[];
  S.cfg.calc.forEach(function(r,i){
    var tag='নিয়ম '+(i+1)+': ';
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.from)){errs.push(tag+'মাস বাছুন');return;}
    if(seen[r.from]){errs.push(tag+'একই মাস দুবার ('+r.from+')');return;}
    seen[r.from]=1;
    var o={from:r.from},any=false,badv=false;
    RULE_KEYS.forEach(function(k){
      var v=String(r[k[0]]).trim();if(v==='')return;
      var n=Number(v);
      if(!isFinite(n)||n<k[2]||n>k[3]){errs.push(tag+k[1]+' — '+k[2]+' থেকে '+k[3]+' এর মধ্যে দিন');badv=true;return;}
      o[k[0]]=n;any=true;
    });
    if(!any&&!badv)errs.push(tag+'অন্তত একটা মান দিন');
    calc.push(o);
  });
  if(calc.length)out.calc=calc;
  var ads={};['salary','workers','report','banner','native'].forEach(function(k){if(typeof S.cfg.ads[k]==='boolean')ads[k]=S.cfg.ads[k];});
  var ids={};
  [['ot','OT ব্যানার'],['salary','বেতন ব্যানার'],['employee','কর্মী/রিপোর্ট ব্যানার'],['native','নেটিভ']].forEach(function(k){
    var v=String((S.cfg.ads.ids||{})[k[0]]||'').trim();if(v==='')return;
    if(!/^ca-app-pub-\d{10,20}\/\d{6,15}$/.test(v))errs.push(k[1]+' ইউনিট আইডি ভুল (ca-app-pub-XXXX/YYYY)');else ids[k[0]]=v;
  });
  if(Object.keys(ids).length)ads.ids=ids;
  if(Object.keys(ads).length)out.ads=ads;
  var d={},D=S.cfg.defaults;
  var nr=String(D.nightRate==null?'':D.nightRate).trim();
  if(nr!==''){var a=Number(nr);if(!isFinite(a)||a<0||a>100000)errs.push('নাইট রেট ০–১,০০,০০০ এর মধ্যে দিন');else d.nightRate=a;}
  var wd=String(D.workDays==null?'':D.workDays).trim();
  if(wd!==''){var b=Number(wd);if(!isFinite(b)||b<20||b>31)errs.push('কার্যদিবস ২০–৩১ এর মধ্যে দিন');else d.workDays=b;}
  if(typeof D.bonusOn==='boolean')d.bonusOn=D.bonusOn;
  var ba=String(D.bonusAmt==null?'':D.bonusAmt).trim();
  if(ba!==''){var c=Number(ba);if(!isFinite(c)||c<0||c>10000000)errs.push('বোনাস ০–১,০০,০০,০০০ এর মধ্যে দিন');else d.bonusAmt=c;}
  if(Object.keys(d).length)out.defaults=d;
  var off={};FLAG_KEYS.forEach(function(k){if(S.cfg.flags[k[0]]===false)off[k[0]]=false;});
  if(Object.keys(off).length){sched(S.cfg.flags,off,errs,'সুইচ: ');out.flags=off;}
  var mn={},soft=String(S.cfg.min.soft||'').trim(),hard=String(S.cfg.min.hard||'').trim();
  if(soft||hard){
    if(soft){if(!/^\d+(\.\d+){0,3}$/.test(soft))errs.push('নরম আপডেটের সংস্করণ এমন হবে: 4.0.2');else mn.soft=soft;}
    if(hard){if(!/^\d+(\.\d+){0,3}$/.test(hard))errs.push('বাধ্যতামূলক আপডেটের সংস্করণ এমন হবে: 4.0.2');else mn.hard=hard;}
    var mm=String(S.cfg.min.msg||'').trim();if(mm.length>300)errs.push('আপডেট বার্তা ৩০০ অক্ষরের মধ্যে');else if(mm)mn.msg=mm;
    var mu=String(S.cfg.min.url||'').trim();if(mu){if(!/^https:\/\/\S+$/.test(mu))errs.push('আপডেট লিংক https:// দিয়ে শুরু হতে হবে');else mn.url=mu;}
    sched(S.cfg.min,mn,errs,'আপডেট গেট: ');
    out.min=mn;
  }
  if(S.cfg.maint.on===true){
    var mt={on:true},ms=String(S.cfg.maint.msg||'').trim();
    if(ms.length>300)errs.push('রক্ষণাবেক্ষণ বার্তা ৩০০ অক্ষরের মধ্যে');else if(ms)mt.msg=ms;
    sched(S.cfg.maint,mt,errs,'রক্ষণাবেক্ষণ: ');
    out.maint=mt;
  }
  var occ=[];
  S.cfg.occ.forEach(function(e,i){
    var t=String(e.title).trim();
    if(!e.date&&!t)return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!t){errs.push('দিবস '+(i+1)+': তারিখ ও নাম দুটোই দিন');return;}

function effP(target){
  var p={};for(var k in DEF)p[k]=DEF[k];
  if(target>='2026-11')p.exact=1;
  S.cfg.calc.filter(function(r){return /^\d{4}-\d{2}$/.test(r.from)&&r.from<=target;}).sort(function(a,b){return a.from<b.from?-1:1;}).forEach(function(r){RULE_KEYS.forEach(function(k){var v=String(r[k[0]]).trim();if(v!==''&&isFinite(Number(v)))p[k[0]]=Number(v);});});
  return p;
}
function t4(x){return Math.floor(x*10000+1e-7)/10000;}
function steps(g,p){
  var mid=g-p.allowance,room,basic,ot,ab;
  if(p.exact){room=Math.floor(mid/p.basicDiv);basic=room*p.basicMul;ot=t4(basic/p.otDiv);ab=t4(basic/p.dayDiv);}
  else{room=Math.round(mid/p.basicDiv*100)/100;basic=Math.round(mid/p.basicDiv*p.basicMul);ot=Math.round(mid/p.basicDiv*(p.otNum/p.otDiv)*100)/100;ab=basic/p.dayDiv;}
  return 'গ্রস বেতন = '+g+'<br>অন্যান্য খরচ = '+p.allowance+'<br>মিড বেতন = '+g+' − '+p.allowance+' = '+mid+'<br>রুম রেন্ট = '+mid+' ÷ '+p.basicDiv+' = '+room+'<br>বেসিক বেতন = '+room+' × '+p.basicMul+' = '+basic+'<br>ওভারটাইম রেট = '+basic+' ÷ '+p.otDiv+' = '+ot+'<br>অনুপস্থিতি রেট = '+basic+' ÷ '+p.dayDiv+' = '+ab+(p.exact?'':'<br><i>(পুরনো পদ্ধতি: রাউন্ড করা)</i>');
}

function bindLogin(){
  if($('doUnlock')){
    var go=async function(){
      try{S.token=await unlockToken($('pw').value);S.msg=null;await loadAll();}
      catch(e){S.token=null;setMsg('bad','ভুল পাসওয়ার্ড');render();}

      var tk=$('tk').value.trim(),p1=$('pw').value,p2=$('pw2').value;
      if(!tk){setMsg('bad','টোকেন দিন');render();return;}
      if(p1.length<6){setMsg('bad','পাসওয়ার্ড কমপক্ষে ৬ অক্ষর');render();return;}
      if(p1!==p2){setMsg('bad','দুই পাসওয়ার্ড মেলেনি');render();return;}
      S.token=tk;
      try{
        var r=await gh('/repos/'+OWNER+'/'+REPO);
        if(r.permissions&&r.permissions.push===false)throw Object.assign(new Error('লেখার অনুমতি নেই'),{status:403});
        await lockToken(tk,p1);S.msg=null;await loadAll();
      }catch(e){S.token=null;setMsg('bad',errText(e));render();}
    };
  }
}

function fmtDT(iso){var d=new Date(iso);return isNaN(d.getTime())?iso:d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function histHtml(){

  if(H.file==='config.json')h+='<div class="msg warn" style="margin-bottom:0">মনে রাখুন: যে ফোনে হিসাবের নিয়ম আগেই পৌঁছেছে সেখান থেকে তা ফেরে না। ফিরিয়ে দিলে সুইচ, বিজ্ঞাপন, জরুরি ও কনটেন্ট আগের অবস্থায় যায়।</div>';
  h+='</div>';

  if(!H.list)return h+'<div class="card"><button id="histLoad" style="width:100%">ইতিহাস দেখুন</button></div>';
  if(!H.list.length)return h+'<div class="card sub">কোনো সংস্করণ পাওয়া যায়নি।</div>';
  H.list.forEach(function(c,i){
    h+='<div class="card"><div class="top" style="margin-bottom:6px"><div><b>'+esc(fmtDT(c.date))+(i===0?' · বর্তমান':'')+'</b><div class="sub">'+esc(c.msg)+' · '+esc(c.sha.slice(0,7))+'</div></div></div><div class="row"><button class="ghost" data-hv="'+c.sha+'">দেখুন</button><button class="ghost" data-hl="'+c.sha+'">ফর্মে আনুন</button>'+(i===0?'':'<button data-hr="'+c.sha+'">ফিরিয়ে দিন</button>')+'</div>';
    if(H.view&&H.view.sha===c.sha)h+='<pre>'+esc(JSON.stringify(H.view.json,null,2))+'</pre>';

}
function render(){

  app.innerHTML=viewMain();bindMain();
}
function keep(fn){var y=window.scrollY;fn();render();window.scrollTo(0,y);}

function $(id){return document.getElementById(id);}
function qa(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}
async function loadAll(){
  S.busy=true;setMsg('ok','লোড হচ্ছে…');render();
  try{
    var c=await getFile('config.json'),n=await getFile('notice.json');
    S.cfgSha=c.sha;S.noticeSha=n.sha;loadCfg(c.json);loadNotice(n.json);S.loaded=true;S.msg=null;S.hist.list=null;S.hist.view=null;
  }catch(e){setMsg('bad',errText(e));if(e.status===401){S.token=null;}}
  S.busy=false;render();
}
async function loadHist(){
  S.hist.loading=true;S.hist.view=null;render();
  try{
    var l=await gh('/repos/'+OWNER+'/'+REPO+'/commits?path='+S.hist.file+'&sha='+BRANCH+'&per_page=15');
    S.hist.list=l.map(function(c){return {sha:c.sha,date:c.commit.author.date,msg:String(c.commit.message||'').split('\n')[0]};});
  }catch(e){setMsg('bad',errText(e));S.hist.list=null;}
  S.hist.loading=false;render();
}
async function histGet(sha){
  var d=await gh('/repos/'+OWNER+'/'+REPO+'/contents/'+S.hist.file+'?ref='+sha);
  return JSON.parse(b64ToUtf8(d.content));
}
function bindMain(){
  $('reload').onclick=function(){if(confirm('অসংরক্ষিত পরিবর্তন বাদ যাবে। আবার লোড করবেন?'))loadAll();};

  qa('[data-rule]',function(el){var f=function(){S.cfg.calc[+el.getAttribute('data-rule')][el.getAttribute('data-k')]=el.value;refreshPreview();};el.oninput=f;el.onchange=f;});
  qa('[data-delrule]',function(b){b.onclick=function(){if(confirm('এই নিয়ম তালিকা থেকে সরাবেন? (যে ফোনে আগেই পৌঁছেছে সেখান থেকে যাবে না)'))keep(function(){S.cfg.calc.splice(+b.getAttribute('data-delrule'),1);});};});
  if($('addRule'))$('addRule').onclick=function(){keep(function(){var d=new Date();d.setMonth(d.getMonth()+1);var o={from:d.getFullYear()+'-'+pad2(d.getMonth()+1)};RULE_KEYS.forEach(function(k){o[k[0]]='';});S.cfg.calc.push(o);});};
  qa('[data-pg]',function(el){el.oninput=function(){S.pg=el.value;refreshPreview();};});
  qa('[data-p]',function(el){el.oninput=function(){sp(el.getAttribute('data-p'),el.value);refreshPreview();};});
  qa('[data-pb]',function(el){el.onchange=function(){var p=el.getAttribute('data-pb');if(el.value==='')dp(p);else sp(p,el.value==='1');refreshPreview();};});
  qa('[data-pc]',function(el){el.onchange=function(){sp(el.getAttribute('data-pc'),el.checked);refreshPreview();};});
  qa('[data-dt]',function(el){el.onchange=function(){sp(el.getAttribute('data-dt'),el.value?new Date(el.value).toISOString():'');refreshPreview();};});
  qa('[data-ndt]',function(el){el.onchange=function(){S.notice[el.getAttribute('data-ndt')]=el.value?new Date(el.value).toISOString():'';refreshPreview();};});
  qa('[data-occ]',function(el){el.oninput=function(){S.cfg.occ[+el.getAttribute('data-occ')][el.getAttribute('data-k')]=el.value;refreshPreview();};});
  qa('[data-delocc]',function(b){b.onclick=function(){keep(function(){S.cfg.occ.splice(+b.getAttribute('data-delocc'),1);});};});
  if($('addOcc'))$('addOcc').onclick=function(){keep(function(){S.cfg.occ.push({date:'',title:''});});};
  qa('[data-n]',function(el){
    var k=el.getAttribute('data-n');
    var h=function(){S.notice[k]=el.type==='checkbox'?el.checked:el.value;refreshPreview();};
    el.oninput=h;el.onchange=h;
  });
  if($('newCode'))$('newCode').onclick=function(){keep(function(){S.notice.date=newDate();});};
  qa('[data-hf]',function(b){b.onclick=function(){S.hist.file=b.getAttribute('data-hf');S.hist.list=null;S.hist.view=null;loadHist();};});
  if($('histLoad'))$('histLoad').onclick=loadHist;

    catch(e){setMsg('bad',errText(e));}
    S.busy=false;render();window.scrollTo(0,0);
  };
  qa('[data-hv]',function(b){b.onclick=async function(){try{var j=await histGet(b.getAttribute('data-hv'));S.hist.view={sha:b.getAttribute('data-hv'),json:j};}catch(e){setMsg('bad',errText(e));}keep(function(){});};});
  qa('[data-hl]',function(b){b.onclick=async function(){

      var j=await histGet(b.getAttribute('data-hl'));

      setMsg('warn','পুরনো সংস্করণ ফর্মে এসেছে। দেখে নিয়ে "প্রকাশ করুন" চাপলে তবেই ফোনে যাবে।');

      var j=await histGet(b.getAttribute('data-hr'));

function refreshCalc(){
  var g=Number(S.pg);if(!isFinite(g)||g<=0)g=16000;
  var fx=$('fx');if(fx){var d=new Date(),t=d.getFullYear()+'-'+pad2(d.getMonth()+1);fx.innerHTML='<b>'+t+' মাসের হিসাব</b><br>'+steps(g,effP(t));}
  qa('.cp',function(el){var i=+el.getAttribute('data-cp');el.innerHTML=/^\d{4}-\d{2}$/.test(S.cfg.calc[i].from)?'<b>'+S.cfg.calc[i].from+' থেকে নমুনা</b><br>'+calcAt(i,g):'';});
}
function refreshPreview(){
  if(S.tab==='hist')return;

  var pre=document.querySelector('pre');if(pre)pre.textContent=JSON.stringify(cur.obj,null,2);
  var pv=$('pv');if(pv)pv.innerHTML=previewHtml();
  refreshCalc();
  var b=$('publish');if(b)b.disabled=!!(S.busy||cur.errs.length);
  var old=document.getElementById('errbox');
  if(old)old.remove();
  if(cur.errs.length){var d=document.createElement('div');d.id='errbox';d.className='msg bad';d.innerHTML=cur.errs.map(esc).join('<br>');var bar=document.querySelector('.bar');bar.parentNode.insertBefore(d,bar);}
}
async function publish(){
  var isNote=S.tab==='note';
  var cur=isNote?buildNotice():buildConfig();
  if(cur.errs.length)return;
  var name=isNote?'notice.json':'config.json';
  var o=cur.obj,w=[];
  if(isNote){
    w.push('নোটিশ প্রকাশ করবেন?');
    if(o.rollout!=null)w.push('শুধু '+o.rollout+'% ফোনে যাবে।');
  }else{
    w.push('সুইচ/সেটিং ফোনে পৌঁছে যাবে (হিসাবের নিয়ম স্থায়ী)।');
    if(o.maint)w.push('⚠️ রক্ষণাবেক্ষণ চালু: '+(o.maint.rollout!=null?o.maint.rollout+'% ফোনে':'সব ফোনে')+' অ্যাপ ব্যবহার করা যাবে না!');
    if(o.min&&o.min.hard)w.push('⚠️ সংস্করণ '+o.min.hard+' এর নিচের সবাই অ্যাপ ব্যবহার করতে পারবে না, আপডেট লাগবে!');
    if(o.flags)w.push('বন্ধ হবে: '+FLAG_KEYS.filter(function(k){return o.flags[k[0]]===false;}).map(function(k){return k[1];}).join(', '));
    if(o.ads&&o.ads.ids)w.push('বিজ্ঞাপন আইডি বদলাচ্ছে।');
  }
  if(!confirm(w.join('\n')+'\n\nনিশ্চিত?'))return;
  S.busy=true;S.msg=null;render();
  try{
    var sha=await putFile(name,o,isNote?S.noticeSha:S.cfgSha,'admin: update '+name);
    if(isNote)S.noticeSha=sha;else S.cfgSha=sha;
    S.hist.list=null;
    var mk='ok',mt='✅ প্রকাশ হয়েছে ('+name+'). ফোনে কিছুক্ষণের মধ্যে পৌঁছাবে।';
    if(!isNote){var ar=await trySync(o);mk=ar.k;mt+=ar.t;}
    setMsg(mk,mt);
  }catch(e){setMsg('bad',errText(e));if(e.status===401){S.token=null;}}
  S.busy=false;render();window.scrollTo(0,0);
}
render();
})();
</script>
